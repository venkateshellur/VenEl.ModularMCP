name: Publish ModularMCP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-and-publish-core-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        os: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/VenEl.ModularMCP.Core/VenEl.ModularMCP.Core.csproj
      
    - name: Publish Self-Contained Core Host
      run: |
        dotnet publish src/VenEl.ModularMCP.Core/VenEl.ModularMCP.Core.csproj \
          -c Release \
          -r ${{ matrix.os }} \
          -f net8.0 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish/${{ matrix.os }}
          
    - name: Zip the output
      run: |
        cd ./publish/${{ matrix.os }}
        zip -r ../../VenEl.ModularMCP.Core-${{ matrix.os }}.zip ./*
        cd ../../
        
    - name: Release Core Host
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: VenEl.ModularMCP.Core-${{ matrix.os }}.zip

  publish-plugins-to-nuget:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Pack All Projects (Core as Tool, Plugins as Libraries)
      run: |
        for proj in $(find src -name "*.csproj"); do
          dotnet pack "$proj" -c Release -o nupkg
        done
      
    - name: Push Plugins to NuGet
      run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
